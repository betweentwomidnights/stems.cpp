# Builds and checks the Linux x64/ARM64 Vulkan packages. On its own it is a dry
# run; release.yml calls it with the release tag and attaches what it builds.
name: Linux packaging

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/linux-packaging.yml
      - ci/package-linux.py
      - ci/check-linux-package.py
      - tests/linux_package_test.py
      - CMakeLists.txt
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: release tag to build; empty builds the calling ref as a dry run
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} Vulkan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      PLATFORM: ${{ matrix.platform }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake python3 binutils libvulkan-dev glslc spirv-headers
          if [ "$PLATFORM" = linux-arm64 ]; then
            sudo apt-get install -y gcc-14 g++-14
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          fi

      - name: Build, test, package, and check extracted archives
        run: |
          python3 tests/linux_package_test.py
          version="v$(sed -nE 's/^project\(stems_cpp VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          [ "$version" != v ] || { echo "no project(VERSION) in CMakeLists.txt"; exit 1; }
          # A release's Linux packages must say the release's version.
          if [ -n "$TAG" ] && [ "$TAG" != "$version" ]; then
            echo "tag $TAG does not match project(VERSION) $version"; exit 1
          fi
          python3 ci/package-linux.py --version "$version" --require-clean --jobs 4 --backends vulkan
          (cd dist-linux && sha256sum -c "SHA256SUMS-$PLATFORM")

      - name: Keep verified packages
        uses: actions/upload-artifact@v4
        with:
          name: stems-${{ matrix.platform }}-vulkan
          path: |
            dist-linux/*.zip
            dist-linux/SHA256SUMS-*
          retention-days: 7
